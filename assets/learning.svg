<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Learning curve from June 2025 to October 2026. June to November 2025: HTML, CSS and React. January to March 2026: core and advanced JavaScript. April to August 2026: CivicNest, hero.io and ToyTopia. September 2026: GitPrism and THEIA. Now: building Delta-MRV with Next.js 16, pgvector, MapLibre, and EVM audit trails." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Core theme gradients -->
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1f" />
      <stop offset="1" stop-color="#130d33" />
    </linearGradient>
    <radialGradient id="cardglow" cx="0.88" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cardglow2" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nowglow" cx="0.91" cy="0.33" r="0.28">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.13" />
      <stop offset="1" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="1" stop-color="#d946ef" stop-opacity="0.55" />
    </linearGradient>

    <!-- Curve and area gradients -->
    <!-- gradientUnits=userSpaceOnUse so the stroke gradient spans the visible curve (x 80 to 1095) -->
    <linearGradient id="lineG" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1095" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.45" stop-color="#8b5cf6" />
      <stop offset="0.82" stop-color="#d946ef" />
      <stop offset="1" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30" />
      <stop offset="0.65" stop-color="#d946ef" stop-opacity="0.10" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Vertical stem gradients: userSpaceOnUse is required, because objectBoundingBox gradients are not painted on zero-width (vertical) lines -->
    <linearGradient id="stemPurple" gradientUnits="userSpaceOnUse" x1="0" y1="168" x2="0" y2="216">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.7" />
      <stop offset="1" stop-color="#d946ef" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="stemGreen" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="184">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.8" />
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.08" />
    </linearGradient>

    <clipPath id="cardclip">
      <rect width="1200" height="600" rx="12" />
    </clipPath>
  </defs>

  <!--
    NOTE ON ANIMATION: every element is visible by default (final state).
    SMIL animations then replay the intro in browsers that support them,
    so viewers/renderers without animation support still show the full graphic.
  -->

  <g clip-path="url(#cardclip)" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
    <!-- Background layers -->
    <rect width="1200" height="600" fill="url(#cardbg)" />
    <rect width="1200" height="600" fill="url(#cardglow)" />
    <rect width="1200" height="600" fill="url(#cardglow2)" />
    <rect width="1200" height="600" fill="url(#nowglow)" />

    <!-- Header -->
    <text x="80" y="84" font-size="38" font-weight="800" fill="#eef0ff" letter-spacing="-0.6">Learning curve</text>
    <text x="80" y="122" font-size="20" font-weight="400" fill="#a5b0d6">June 2025 &#8212; now</text>

    <!-- Subtle vertical drop lines from curve milestones to baseline -->
    <g stroke-dasharray="3 5" stroke-width="1">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.636;1" dur="2.2s" begin="0s" fill="freeze" />
      <line x1="418" y1="334" x2="418" y2="410" stroke="#22d3ee" stroke-opacity="0.35" />
      <line x1="664" y1="282" x2="664" y2="410" stroke="#8b5cf6" stroke-opacity="0.35" />
      <line x1="1034" y1="226" x2="1034" y2="410" stroke="#d946ef" stroke-opacity="0.35" />
      <line x1="1095" y1="198" x2="1095" y2="410" stroke="#4ade80" stroke-opacity="0.35" />
    </g>

    <!-- Area under curve -->
    <path d="M 80 404 C 190 382, 310 338, 418 334 C 460 332, 485 333, 520 324 C 570 311, 615 290, 664 282 C 785 262, 920 245, 1034 226 C 1060 221, 1078 210, 1095 198 L 1095 410 L 80 410 Z" fill="url(#areaG)">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.478;1" dur="2.3s" begin="0s" fill="freeze" />
    </path>

    <!-- Main curve (line-draw animation; fully drawn when animation is unsupported) -->
    <path d="M 80 404 C 190 382, 310 338, 418 334 C 460 332, 485 333, 520 324 C 570 311, 615 290, 664 282 C 785 262, 920 245, 1034 226 C 1060 221, 1078 210, 1095 198" fill="none" stroke="url(#lineG)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1100 1100">
      <animate attributeName="stroke-dashoffset" values="1110;1110;0" keyTimes="0;0.0833;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1" dur="2.4s" begin="0s" fill="freeze" />
    </path>

    <!-- X-axis baseline -->
    <line x1="80" y1="410" x2="1120" y2="410" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

    <!-- X-axis month labels (Jun 2025 to Oct 2026) -->
    <g font-size="14" font-weight="600" fill="#6b7398" text-anchor="middle">
      <text x="110" y="442">Jun</text>
      <text x="110" y="466" font-size="13" font-weight="600" fill="#a5b0d6">2025</text>

      <text x="172" y="442">Jul</text>
      <text x="233" y="442">Aug</text>
      <text x="295" y="442">Sep</text>
      <text x="356" y="442">Oct</text>
      <text x="418" y="442" fill="#93c5fd">Nov</text>
      <text x="479" y="442" fill="#454b6b">Dec</text>

      <text x="541" y="442">Jan</text>
      <text x="541" y="466" font-size="13" font-weight="600" fill="#a5b0d6">2026</text>

      <text x="602" y="442">Feb</text>
      <text x="664" y="442" fill="#c4b5fd">Mar</text>
      <text x="725" y="442">Apr</text>
      <text x="787" y="442">May</text>
      <text x="849" y="442">Jun</text>
      <text x="910" y="442">Jul</text>
      <text x="972" y="442">Aug</text>
      <text x="1034" y="442" fill="#f0abfc">Sep</text>
      <text x="1095" y="442" fill="#4ade80" font-weight="700">Oct</text>
    </g>

    <!-- ==================== MILESTONE CALLOUTS (TOP RIGHT) ==================== -->

    <!-- Previous milestone: GitPrism and THEIA (anchored to Sep node) -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.739;1" dur="2.3s" begin="0s" fill="freeze" />
      <line x1="1034" y1="168" x2="1034" y2="216" stroke="url(#stemPurple)" stroke-width="1.5" />
      <circle cx="1034" cy="168" r="2.5" fill="#d946ef" />

      <text x="1022" y="132" text-anchor="end" font-size="11" font-weight="800" fill="#d946ef" letter-spacing="2">SEP 2026 &#183; SHIPPED</text>
      <text x="1022" y="153" text-anchor="end" font-size="18" font-weight="800" fill="#eef0ff">GitPrism &amp; THEIA</text>
      <text x="1022" y="172" text-anchor="end" font-size="13" font-weight="500" fill="#a5b0d6">Next.js + PostgreSQL &#183; WebGL2</text>
    </g>

    <!-- Current milestone: Building Delta-MRV (anchored to Oct node) -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.769;1" dur="2.6s" begin="0s" fill="freeze" />
      <line x1="1095" y1="118" x2="1095" y2="184" stroke="url(#stemGreen)" stroke-width="1.5" />
      <circle cx="1095" cy="118" r="2.5" fill="#4ade80" />

      <text x="1095" y="54" text-anchor="end" font-size="12" font-weight="800" fill="#4ade80" letter-spacing="2.8">NOW</text>
      <text x="1095" y="82" text-anchor="end" font-size="24" font-weight="800" fill="#eef0ff" letter-spacing="-0.3">Building Delta-MRV</text>
      <text x="1095" y="104" text-anchor="end" font-size="14" font-weight="500" fill="#a5b0d6">Next.js 16 + pgvector &#183; MapLibre, AI &amp; EVM trails</text>
    </g>

    <!-- ==================== CURVE NODES ==================== -->
    <!-- Node 1: Nov 2025 (HTML, CSS, React) -->
    <circle cx="418" cy="334" r="14" fill="#22d3ee" fill-opacity="0.12" />
    <circle cx="418" cy="334" r="8.5" fill="#0b0d1f" stroke="#22d3ee" stroke-width="4" />

    <!-- Node 2: Mar 2026 (JavaScript deep) -->
    <circle cx="664" cy="282" r="14" fill="#8b5cf6" fill-opacity="0.14" />
    <circle cx="664" cy="282" r="8.5" fill="#0b0d1f" stroke="#8b5cf6" stroke-width="4" />

    <!-- Node 3: Sep 2026 (GitPrism and THEIA completed) -->
    <circle cx="1034" cy="226" r="14" fill="#d946ef" fill-opacity="0.15" />
    <circle cx="1034" cy="226" r="8.5" fill="#0b0d1f" stroke="#d946ef" stroke-width="4" />

    <!-- Node 4: Oct 2026 / NOW (Building Delta-MRV) -->
    <circle cx="1095" cy="198" r="9" fill="#4ade80" opacity="0.6">
      <animate attributeName="r" values="9;24;9" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1095" cy="198" r="8.5" fill="#4ade80" />

    <!-- ==================== BOTTOM PHASE PILLS ==================== -->
    <!-- Pill 1: Jun - Nov 2025 -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4545;1" dur="1.1s" begin="0s" fill="freeze" />
      <rect x="80" y="492" width="352" height="52" rx="8" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.55" />
      <text x="256" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#eef0ff">HTML &#183; CSS &#183; React</text>
      <text x="256" y="533" text-anchor="middle" font-size="11.5" font-weight="500" fill="#67e8f9" fill-opacity="0.85">Jun &#8211; Nov 2025 &#183; Responsive UI Foundations</text>
    </g>

    <!-- Pill 2: Jan - Mar 2026 -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.625;1" dur="1.6s" begin="0s" fill="freeze" />
      <rect x="444" y="492" width="228" height="52" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.55" />
      <text x="558" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#eef0ff">JavaScript &#183; deep</text>
      <text x="558" y="533" text-anchor="middle" font-size="11.5" font-weight="500" fill="#c4b5fd" fill-opacity="0.85">Jan &#8211; Mar 2026 &#183; Core &amp; Async JS</text>
    </g>

    <!-- Pill 3: Apr - Aug 2026 -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.714;1" dur="2.1s" begin="0s" fill="freeze" />
      <rect x="684" y="492" width="256" height="52" rx="8" fill="#d946ef" fill-opacity="0.15" stroke="#d946ef" stroke-opacity="0.55" />
      <text x="812" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#eef0ff">CivicNest &#183; hero.io &#183; ToyTopia</text>
      <text x="812" y="533" text-anchor="middle" font-size="11.5" font-weight="500" fill="#f0abfc" fill-opacity="0.85">Apr &#8211; Aug 2026 &#183; Full-Stack MERN Apps</text>
    </g>

    <!-- Pill 4: Sep - Oct 2026 -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.76;1" dur="2.5s" begin="0s" fill="freeze" />
      <rect x="948" y="492" width="172" height="52" rx="8" fill="#4ade80" fill-opacity="0.13" stroke="#4ade80" stroke-opacity="0.55" />
      <text x="1034" y="515" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0ff">GitPrism &#183; Delta-MRV</text>
      <text x="1034" y="533" text-anchor="middle" font-size="11" font-weight="500" fill="#86efac" fill-opacity="0.9">Sep &#8211; Now &#183; Next.js &amp; AI</text>
    </g>
  </g>

  <!-- Outer card border -->
  <rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="12" fill="none" stroke="url(#cardedge)" stroke-width="1.5" />
</svg>
