<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Learning curve from June 2025 to October 2026. June to November 2025: HTML, CSS and React. January to March 2026: core and advanced JavaScript. April to August 2026: CivicNest, hero.io and ToyTopia. September 2026: GitPrism and THEIA. Now: building Delta-MRV with Next.js 16, pgvector, MapLibre, and EVM audit trails.">
  <defs>
    <!-- Core Theme Gradients -->
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1f" />
      <stop offset="1" stop-color="#130d33" />
    </linearGradient>
    <radialGradient id="cardglow" cx="0.88" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cardglow2" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nowglow" cx="0.91" cy="0.33" r="0.28">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.13" />
      <stop offset="1" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardedge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="1" stop-color="#d946ef" stop-opacity="0.55" />
    </linearGradient>

    <!-- Curve & Area Gradients -->
    <linearGradient id="lineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.45" stop-color="#8b5cf6" />
      <stop offset="0.82" stop-color="#d946ef" />
      <stop offset="1" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30" />
      <stop offset="0.65" stop-color="#d946ef" stop-opacity="0.10" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Vertical Stem Gradients -->
    <linearGradient id="stemPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.7" />
      <stop offset="1" stop-color="#d946ef" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="stemGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.8" />
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.08" />
    </linearGradient>

    <clipPath id="cardclip">
      <rect width="1200" height="600" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardclip)" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
    <!-- Background Layers -->
    <rect width="1200" height="600" fill="url(#cardbg)" />
    <rect width="1200" height="600" fill="url(#cardglow)" />
    <rect width="1200" height="600" fill="url(#cardglow2)" />
    <rect width="1200" height="600" fill="url(#nowglow)" />

    <!-- Header -->
    <text x="80" y="84" font-size="38" font-weight="800" fill="#eef0ff" letter-spacing="-0.6">Learning curve</text>
    <text x="80" y="122" font-size="20" font-weight="400" fill="#a5b0d6">June 2025 — now</text>

    <!-- Subtle Vertical Drop Lines from Curve Milestones to Baseline -->
    <g stroke-dasharray="3 5" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.4s" fill="freeze" />
      <line x1="418" y1="334" x2="418" y2="410" stroke="#22d3ee" stroke-opacity="0.35" />
      <line x1="664" y1="282" x2="664" y2="410" stroke="#8b5cf6" stroke-opacity="0.35" />
      <line x1="1034" y1="226" x2="1034" y2="410" stroke="#d946ef" stroke-opacity="0.35" />
      <line x1="1095" y1="198" x2="1095" y2="410" stroke="#4ade80" stroke-opacity="0.35" />
    </g>

    <!-- Area Under Curve -->
    <path d="M 80 404 C 190 382, 310 338, 418 334 C 460 332, 485 333, 520 324 C 570 311, 615 290, 664 282 C 785 262, 920 245, 1034 226 C 1060 221, 1078 210, 1095 198 L 1095 410 L 80 410 Z" fill="url(#areaG)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1.1s" fill="freeze" />
    </path>

    <!-- Main Animated Curve -->
    <path d="M 80 404 C 190 382, 310 338, 418 334 C 460 332, 485 333, 520 324 C 570 311, 615 290, 664 282 C 785 262, 920 245, 1034 226 C 1060 221, 1078 210, 1095 198" fill="none" stroke="url(#lineG)" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.2s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />
    </path>

    <!-- X-Axis Baseline -->
    <line x1="80" y1="410" x2="1120" y2="410" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

    <!-- X-Axis Month Labels (Exact Spacing: Jun 2025 to Oct 2026) -->
    <g font-size="14" font-weight="600" fill="#6b7398" text-anchor="middle">
      <text x="110" y="442">Jun</text>
      <text x="110" y="466" font-size="13" font-weight="600" fill="#a5b0d6">2025</text>

      <text x="172" y="442">Jul</text>
      <text x="233" y="442">Aug</text>
      <text x="295" y="442">Sep</text>
      <text x="356" y="442">Oct</text>
      <text x="418" y="442" fill="#93c5fd">Nov</text>
      <text x="479" y="442" fill="#454b6b">Dec</text>

      <text x="541" y="442">Jan</text>
      <text x="541" y="466" font-size="13" font-weight="600" fill="#a5b0d6">2026</text>

      <text x="602" y="442">Feb</text>
      <text x="664" y="442" fill="#c4b5fd">Mar</text>
      <text x="725" y="442">Apr</text>
      <text x="787" y="442">May</text>
      <text x="849" y="442">Jun</text>
      <text x="910" y="442">Jul</text>
      <text x="972" y="442">Aug</text>
      <text x="1034" y="442" fill="#f0abfc">Sep</text>
      <text x="1095" y="442" fill="#4ade80" font-weight="700">Oct</text>
    </g>

    <!-- ==================== MILESTONE CALLOUTS (TOP RIGHT) ==================== -->

    <!-- Previous Milestone Callout: GitPrism & THEIA (Anchored to Sep Node) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.7s" fill="freeze" />
      <!-- Vertical Stem from Sep Node (1034, 226) up to Callout -->
      <line x1="1034" y1="168" x2="1034" y2="216" stroke="url(#stemPurple)" stroke-width="1.5" />
      <circle cx="1034" cy="168" r="2.5" fill="#d946ef" />
      
      <text x="1022" y="132" text-anchor="end" font-size="11" font-weight="800" fill="#d946ef" letter-spacing="2">SEP 2026 · SHIPPED</text>
      <text x="1022" y="153" text-anchor="end" font-size="18" font-weight="800" fill="#eef0ff">GitPrism & THEIA</text>
      <text x="1022" y="172" text-anchor="end" font-size="13" font-weight="500" fill="#a5b0d6">Next.js + PostgreSQL · WebGL2</text>
    </g>

    <!-- Current Milestone Callout: Building Delta-MRV (Anchored to Oct Node) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.0s" fill="freeze" />
      <!-- Vertical Stem from Oct Node (1095, 198) up to Callout -->
      <line x1="1095" y1="118" x2="1095" y2="184" stroke="url(#stemGreen)" stroke-width="1.5" />
      <circle cx="1095" cy="118" r="2.5" fill="#4ade80" />

      <text x="1095" y="54" text-anchor="end" font-size="12" font-weight="800" fill="#4ade80" letter-spacing="2.8">NOW</text>
      <text x="1095" y="82" text-anchor="end" font-size="24" font-weight="800" fill="#eef0ff" letter-spacing="-0.3">Building Delta-MRV</text>
      <text x="1095" y="104" text-anchor="end" font-size="14" font-weight="500" fill="#a5b0d6">Next.js 16 + pgvector · MapLibre, AI & EVM trails</text>
    </g>

    <!-- ==================== CURVE NODES ==================== -->
    <!-- Node 1: Nov 2025 (HTML, CSS, React) -->
    <circle cx="418" cy="334" r="14" fill="#22d3ee" fill-opacity="0.12" />
    <circle cx="418" cy="334" r="8.5" fill="#0b0d1f" stroke="#22d3ee" stroke-width="4" />

    <!-- Node 2: Mar 2026 (JavaScript deep) -->
    <circle cx="664" cy="282" r="14" fill="#8b5cf6" fill-opacity="0.14" />
    <circle cx="664" cy="282" r="8.5" fill="#0b0d1f" stroke="#8b5cf6" stroke-width="4" />

    <!-- Node 3: Sep 2026 (GitPrism & THEIA Completed) -->
    <circle cx="1034" cy="226" r="14" fill="#d946ef" fill-opacity="0.15" />
    <circle cx="1034" cy="226" r="8.5" fill="#0b0d1f" stroke="#d946ef" stroke-width="4" />

    <!-- Node 4: Oct 2026 / NOW (Building Delta-MRV) -->
    <circle cx="1095" cy="198" r="9" fill="#4ade80" opacity="0.6">
      <animate attributeName="r" values="9;24;9" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1095" cy="198" r="8.5" fill="#4ade80" />

    <!-- ==================== BOTTOM PHASE PILLS (ALIGNED TO TIMELINE) ==================== -->
    <!-- Pill 1: Jun – Nov 2025 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze" />
      <rect x="80" y="492" width="352" height="52" rx="8" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.55" />
      <text x="256" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#eef0ff">HTML · CSS · React</text>
      <text x="256" y="533" text-anchor="middle" font-size="11.5" font-weight="500" fill="#67e8f9" fill-opacity="0.85">Jun – Nov 2025 · Responsive UI Foundations</text>
    </g>

    <!-- Pill 2: Jan – Mar 2026 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze" />
      <rect x="444" y="492" width="228" height="52" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.55" />
      <text x="558" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#eef0ff">JavaScript · deep</text>
      <text x="558" y="533" text-anchor="middle" font-size="11.5" font-weight="500" fill="#c4b5fd" fill-opacity="0.85">Jan – Mar 2026 · Core & Async JS</text>
    </g>

    <!-- Pill 3: Apr – Aug 2026 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze" />
      <rect x="684" y="492" width="262" height="52" rx="8" fill="#d946ef" fill-opacity="0.15" stroke="#d946ef" stroke-opacity="0.55" />
      <text x="815" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#eef0ff">CivicNest · hero.io · ToyTopia</text>
      <text x="815" y="533" text-anchor="middle" font-size="11.5" font-weight="500" fill="#f0abfc" fill-opacity="0.85">Apr – Aug 2026 · Full-Stack MERN Apps</text>
    </g>

    <!-- Pill 4: Sep – Oct 2026 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.9s" fill="freeze" />
      <rect x="958" y="492" width="162" height="52" rx="8" fill="#4ade80" fill-opacity="0.13" stroke="#4ade80" stroke-opacity="0.55" />
      <text x="1039" y="515" text-anchor="middle" font-size="14.5" font-weight="700" fill="#eef0ff">GitPrism · Delta-MRV</text>
      <text x="1039" y="533" text-anchor="middle" font-size="11" font-weight="500" fill="#86efac" fill-opacity="0.9">Sep – Now · Next.js & AI</text>
    </g>
  </g>

  <!-- Outer Card Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="12" fill="none" stroke="url(#cardedge)" stroke-width="1.5" />
</svg>