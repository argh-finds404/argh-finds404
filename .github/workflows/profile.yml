name: Update profile (snake + quote of the day)

on:
  # every day at 00:05 UTC (6:05 am in Bangladesh)
  schedule:
    - cron: "5 0 * * *"
  # run it by hand from the Actions tab
  workflow_dispatch:
  # and whenever you push to main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Draw the snake from my contribution graph (violet theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7c3aed&color_dots=#ebe7ff,#c4b5fd,#a78bfa,#8b5cf6,#6d28d9
            dist/github-contribution-grid-snake-dark.svg?color_snake=#d946ef&color_dots=#161a33,#3b2a7a,#5b3fb8,#8b5cf6,#c4b5fd

      - name: Install the font tools for the quote card
        run: pip install --quiet fonttools brotli uharfbuzz

      - name: Fetch today's quote and draw the card
        run: python3 scripts/quote.py dist/quote.svg

      - name: Publish everything to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
